[package]
name = "lambda-discipline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lazy, statically typed functional language based on the lambda calculus"
license = "MIT"
repository = "https://github.com/lambda-discipline/lambda-discipline"
readme = "README.md"
keywords = ["lambda-calculus", "functional", "interpreter", "language", "hindley-milner"]
categories = ["compilers", "command-line-utilities"]
exclude = [".github/", "examples/aoc-24/"]

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
imbl = "7.0.2"
logos = "0.16.1"
mimalloc = "0.1.52"
rustyline = { version = "17.0.2", default-features = false, features = ["with-file-history"] }
strsim = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.8"
