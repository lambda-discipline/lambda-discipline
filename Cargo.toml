[package]
name = "lambda-discipline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lazy, statically typed functional language based on the lambda calculus"
license = "MIT"
repository = "https://github.com/lambda-discipline/lambda-discipline"
readme = "README.md"
keywords = ["lambda-calculus", "functional", "interpreter", "language", "hindley-milner"]
categories = ["compilers", "command-line-utilities"]
exclude = [".github/", "examples/aoc-24/", "fuzz/"]

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
imbl = "7.0.2"
logos = "0.16.1"
mimalloc = "0.1.52"
rustyline = { version = "17.0.2", default-features = false, features = ["with-file-history"] }
strsim = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
arbitrary = "1.4.1"
arbtest = "0.3.2"
lbd-smith = { path = "crates/lbd-smith" }
assert_cmd = "2.2.2"
libtest-mimic = "0.8.2"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.8"
toml_edit = "0.25.17"

[workspace]
members = ["crates/lbd-smith"]

[lints]
workspace = true

# Shared by every crate in the workspace (`[lints] workspace = true`). CI runs
# clippy with `-D warnings`, so every warning here fails the build.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Most functions are internal even where they are `pub`; `#[must_use]` on all
# of them would be noise rather than a guard.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# The library is not a published API yet, so these sections would document
# nothing a caller relies on.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Checker and machine loops are long by nature; splitting them hurts reading.
too_many_lines = "allow"
# `write!` saves an allocation but reads worse, and none of these strings are
# built on a hot path.
format_collect = "allow"
format_push_string = "allow"

[[bin]]
name = "lbd"
path = "src/main.rs"

# Golden tests list one test per manifest, so they bring their own harness.
[[test]]
name = "golden"
harness = false
