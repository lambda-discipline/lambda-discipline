name: Test examples on debug-build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          bash scripts/build.sh Debug

      - name: Run Golden Tests
        run: |
          bash tests/run_tests.sh
